server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Permitted-Cross-Domain-Policies none always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location ~ /\.(?!well-known) { deny all; }
    # Mantenha os hosts em connect-src e frame-ancestors alinhados com config.js.
    add_header Content-Security-Policy "default-src 'none'; base-uri 'self'; object-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://proton-crm-supabase.sizrit.easypanel.host wss://proton-crm-supabase.sizrit.easypanel.host; form-action 'self'; frame-ancestors 'self' https://cs.clickmassa.com.br" always;
    location = /config.js { expires -1; try_files $uri =404; }
    location = /index.html { expires -1; try_files $uri =404; }
    location = /version.txt { expires -1; try_files $uri =404; }
    location /assets/ { expires 1h; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(sql|md|example\.js)$ { deny all; }
    location /docs/ { deny all; }
    location /n8n/ { deny all; }
    location /integrations/ { deny all; }
    location /tests/ { deny all; }
}
