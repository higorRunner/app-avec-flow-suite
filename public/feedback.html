<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Avalie seu atendimento</title><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/feedback.css"></head>
<body><main><img class="feedback-logo" src="/logo.webp" alt="FlowSuite" width="210" height="70"><p class="eyebrow">Sua opinião faz a diferença</p><h1>Como foi seu atendimento?</h1><p id="intro">Conte como foi sua experiência. É rápido e ajuda a melhorar os próximos atendimentos.</p>
<p id="status" role="status" aria-live="polite">Verificando avaliação…</p>
<form id="survey" hidden><fieldset><legend>Escolha uma nota</legend><div class="scores">
<label><input type="radio" name="score" value="1" required><span>1</span><small>Muito ruim</small></label>
<label><input type="radio" name="score" value="2"><span>2</span><small>Ruim</small></label>
<label><input type="radio" name="score" value="3"><span>3</span><small>Regular</small></label>
<label><input type="radio" name="score" value="4"><span>4</span><small>Bom</small></label>
<label><input type="radio" name="score" value="5"><span>5</span><small>Excelente</small></label>
</div></fieldset><label for="comment">Quer deixar um comentário? <small>(opcional)</small></label><textarea id="comment" name="comment" maxlength="1000" rows="4" placeholder="O que podemos manter ou melhorar?"></textarea><button type="submit">Enviar avaliação</button><p class="hint">A avaliação pode ser enviada uma vez. Evite incluir dados pessoais no comentário.</p></form>
</main><script type="module" src="/feedback.js"></script></body></html>
